<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="kalkulator">
      <!-- Layar -->
      <div class="layar">
        <div class="layar-rumus" id="layar-rumus"></div>
        <div class="layar-angka" id="layar-angka">0</div>
      </div>

      <div class="tombol-grid">
        <button
          class="tombol tombol-fn"
          data-aksi="hapusSemua"
          data-key="Escape"
        >
          AC
        </button>
        <button
          class="tombol tombol-fn"
          data-aksi="hapusSatu"
          data-key="Backspace"
        >
          ⌫
        </button>
        <button class="tombol tombol-fn" data-aksi="persen" data-key="%">
          %
        </button>
        <button
          class="tombol tombol-op"
          data-aksi="operator"
          data-nilai="bagi"
          data-key="/"
        >
          ÷
        </button>

        <button class="tombol" data-aksi="angka" data-nilai="7" data-key="7">
          7
        </button>
        <button class="tombol" data-aksi="angka" data-nilai="8" data-key="8">
          8
        </button>
        <button class="tombol" data-aksi="angka" data-nilai="9" data-key="9">
          9
        </button>
        <button
          class="tombol tombol-op"
          data-aksi="operator"
          data-nilai="kali"
          data-key="*"
        >
          ×
        </button>

        <button class="tombol" data-aksi="angka" data-nilai="4" data-key="4">
          4
        </button>
        <button class="tombol" data-aksi="angka" data-nilai="5" data-key="5">
          5
        </button>
        <button class="tombol" data-aksi="angka" data-nilai="6" data-key="6">
          6
        </button>
        <button
          class="tombol tombol-op"
          data-aksi="operator"
          data-nilai="kurang"
          data-key="-"
        >
          −
        </button>

        <button class="tombol" data-aksi="angka" data-nilai="1" data-key="1">
          1
        </button>
        <button class="tombol" data-aksi="angka" data-nilai="2" data-key="2">
          2
        </button>
        <button class="tombol" data-aksi="angka" data-nilai="3" data-key="3">
          3
        </button>
        <button
          class="tombol tombol-op"
          data-aksi="operator"
          data-nilai="tambah"
          data-key="+"
        >
          +
        </button>

        <button class="tombol tombol-fn" data-aksi="ubahTanda">±</button>
        <button class="tombol" data-aksi="angka" data-nilai="0" data-key="0">
          0
        </button>
        <button class="tombol" data-aksi="koma" data-key=",">,</button>
        <button
          class="tombol tombol-sama"
          data-aksi="samaDengan"
          data-key="Enter"
        >
          =
        </button>
      </div>
    </main>

    <!-- Urutan penting: file yang dipakai file lain harus dimuat lebih dulu -->
    <script src="js/hitung.js"></script>
    <script src="js/layar.js"></script>
    <script src="js/kalkulator.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
